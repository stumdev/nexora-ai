name: Relatar um bug
description: Algo não funciona como deveria
labels: [bug]
body:
  - type: textarea
    id: o-que-aconteceu
    attributes:
      label: O que aconteceu?
      description: Descreva o problema e o que você esperava.
    validations:
      required: true
  - type: textarea
    id: como-reproduzir
    attributes:
      label: Como reproduzir
      placeholder: |
        1. Rodei `nexora ...`
        2. Digitei ...
        3. Vi o erro ...
    validations:
      required: true
  - type: dropdown
    id: interface
    attributes:
      label: Interface
      options: [CLI, Web, Ambas]
    validations:
      required: true
  - type: input
    id: ambiente
    attributes:
      label: Ambiente
      description: Sistema operacional e versão do Node (`node -v`).
      placeholder: Windows 11, Node 22
  - type: markdown
    attributes:
      value: "⚠️ Nunca cole sua chave da Groq (`gsk_...`) aqui."
